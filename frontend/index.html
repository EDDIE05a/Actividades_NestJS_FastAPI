<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inscripción de Estudiantes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <h1 class="mb-4">Inscripción de Estudiantes en Cursos</h1>

  <div class="mb-3">
    <label for="estudiante" class="form-label">Seleccionar Estudiante:</label>
    <select id="estudiante" class="form-select"></select>
  </div>

  <div class="mb-3">
    <label for="curso" class="form-label">Seleccionar Curso:</label>
    <select id="curso" class="form-select"></select>
  </div>

  <button class="btn btn-primary" onclick="inscribir()">Inscribir</button>

  <hr>

  <h3>Cursos Inscritos</h3>
  <ul id="lista-cursos" class="list-group"></ul>

  <script src="./js/script.js"></script>
</body>
</html>
