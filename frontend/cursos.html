<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Cursos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4">Registrar Curso</h2>
    <form id="form-curso">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre del Curso</label>
        <input type="text" id="nombre" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea id="descripcion" class="form-control" required></textarea>
      </div>
      <div class="mb-3">
        <label for="creditos" class="form-label">Créditos</label>
        <input type="number" id="creditos" class="form-control" required min="1">
      </div>
      <button type="submit" class="btn btn-success">Registrar Curso</button>
    </form>

    <hr class="my-4">

    <h3>Lista de Cursos</h3>
    <ul id="lista-cursos" class="list-group"></ul>
  </div>

  <div>
    <a href="index.html">Ir a Estudiantes</a>
  </div>

  <script src="js/Curso.js"></script>
  <script src="js/cursos.js"></script>
</body>
</html>
