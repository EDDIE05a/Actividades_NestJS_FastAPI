<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='static/css/index.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-warehouse"></i> Gestion de Inventario</h1>
        </header>
        
        <div class="content">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            <i class="fas fa-exclamation-circle"></i> {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form action="{{ url_for('procesar_archivo') }}" method="post" enctype="multipart/form-data">
                <div class="upload-box" id="upload-box">
                    <h2>Selecciona tu archivo de inventario</h2>
                    <p>Arrastra y suelta tu archivo Excel o haz clic en el botón</p>
                    <input type="file" name="archivo" id="archivo" class="file-input" accept=".xlsx, .xls">
                    <label for="archivo" class="file-label">
                        <i class="fas fa-upload"></i> Seleccionar archivo
                    </label>
                    <div id="filename-display" class="filename-display"></div>
                </div>
                
                <button type="submit" class="submit-btn" id="submit-btn" disabled>
                    <i class="fas fa-cogs"></i> Procesar inventario
                </button>
            </form>
        </div>
    </div>
    
    <script>
        const fileInput = document.getElementById('archivo');
        const submitBtn = document.getElementById('submit-btn');
        const filenameDisplay = document.getElementById('filename-display');
        const uploadBox = document.getElementById('upload-box');
        
        fileInput.addEventListener('change', function() {
            if (fileInput.files.length > 0) {
                const fileName = fileInput.files[0].name;
                filenameDisplay.textContent = `Archivo seleccionado: ${fileName}`;
                filenameDisplay.style.display = 'block';
                submitBtn.disabled = false;
            } else {
                filenameDisplay.style.display = 'none';
                submitBtn.disabled = true;
            }
        });
        
        // Soporte para arrastrar y soltar
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadBox.addEventListener(eventName, preventDefaults, false);
        });
        
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        ['dragenter', 'dragover'].forEach(eventName => {
            uploadBox.addEventListener(eventName, highlight, false);
        });
        
        ['dragleave', 'drop'].forEach(eventName => {
            uploadBox.addEventListener(eventName, unhighlight, false);
        });
        
        function highlight() {
            uploadBox.style.backgroundColor = 'rgba(74, 111, 165, 0.2)';
            uploadBox.style.borderStyle = 'solid';
        }
        
        function unhighlight() {
            uploadBox.style.backgroundColor = 'rgba(74, 111, 165, 0.05)';
            uploadBox.style.borderStyle = 'dashed';
        }
        
        uploadBox.addEventListener('drop', handleDrop, false);
        
        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            
            if (files.length > 0) {
                fileInput.files = files;
                const fileName = files[0].name;
                filenameDisplay.textContent = `Archivo seleccionado: ${fileName}`;
                filenameDisplay.style.display = 'block';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
